# Raspberry Pi GPIO başlığı üzerinden SWD (denenmiş ayar: openocd-stm32f730 0.12.0-FINAL).
# GPIO24 (başlıkta pin 18) -> SWDIO, GPIO25 (pin 22) -> SWCLK, GND (pin 20) -> GND. Gerilim 3,3 V.
# peripheral_base paket kurulumunda Pi modeline göre ayarlanır.
adapter driver bcm2835gpio
bcm2835gpio peripheral_base 0x3F000000
bcm2835gpio speed_coeffs 146203 36
adapter gpio swdio 24
adapter gpio swclk 25
adapter speed 1000
transport select swd
