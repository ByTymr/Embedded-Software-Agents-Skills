name: OpenOCD Link

on:
  push:
    paths: ['skills/remote-board-link/**', '.github/workflows/openocd-link.yml']
  pull_request:
    paths: ['skills/remote-board-link/**', '.github/workflows/openocd-link.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/remote-board-link/openocd-link
    steps:
      - uses: actions/checkout@v4
      - name: Test Rust workspace
        run: cargo test --workspace --locked
      - name: Check installer syntax
        run: |
          sh -n packaging/linux/debian/postinst
          sh -n ../scripts/build-deb-armhf.sh
